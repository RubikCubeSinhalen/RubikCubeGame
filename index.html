<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cube Solve – Play Rubik's Cube in your browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <h1>Cube Solve</h1>
    <p>Twist it, scramble it, solve it. Drag any sticker to turn a layer.</p>
  </header>

  <main class="app">
    <div class="stage" id="stage" tabindex="0"
      aria-label="Rubik's cube. Drag a sticker to turn a layer, drag the background to rotate the view.">
      <div class="scaler">
        <div class="cube" id="cube"></div>
      </div>
      <div id="tip" role="status"></div>      
      <button id="rv">Reset view</button>
    </div>

    <div class="side">
      <section class="card">
        <div class="stats">
          <div class="stat"><b id="moves">0</b><span>Moves</span></div>
          <div class="stat"><b id="time">0:00.0</b><span>Time</span></div>
          <div class="stat"><b id="best">–</b><span>Best time</span></div>
        </div>
        <p class="small" id="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <div class="row">
          <button class="primary" id="scramble">Scramble</button>
          <select id="len" aria-label="Scramble difficulty">
            <option value="8">Easy</option>
            <option value="16" selected>Medium</option>
            <option value="25">Hard</option>
          </select>
        </div>
        <div class="row">
          <button id="undo" title="Ctrl+Z">Undo</button>
          <button id="redo" title="Ctrl+Y">Redo</button>
          <button id="hint" title="H">Hint</button>
        </div>
        <div class="row">
          <button id="solve">Auto-solve</button>
          <button id="reset">Reset</button>
        </div>
      </section>

      <section class="card">
        <details>
          <summary>Face buttons</summary>
          <div class="pad" id="pad"></div>
          <p class="small">Keys: <kbd>U</kbd> <kbd>D</kbd> <kbd>L</kbd> <kbd>R</kbd> <kbd>F</kbd> <kbd>B</kbd> turn
            clockwise, add <kbd>Shift</kbd> for counter-clockwise. <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes, <kbd>H</kbd>
            gives a hint.</p>
        </details>
      </section>
    </div>
  </main>

  <div id="win" role="dialog" aria-modal="true">
    <div class="box">
      <h2 id="wt">Solved!</h2>
      <p id="wp"></p>
      <button class="primary" id="again" style="width:100%">Scramble again</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
